- name: demo on functions
  hosts: local
  connection: local
  vars:
    topics: linux, ansible, docker, k8s, terraform
    topics_list: ['linux', ' ansible', ' docker', ' k8s', ' terraform']
  tasks:
  - name: convert string into list
    debug:
      msg: topics are {{ topics | split (',') }}

  - name: convert list into string
    debug:
      msg: topics are {{ topics_list | join (',') }}

  - name: set default value
    debug:
      msg: "hi {{ greetings |default('good morning') }}"
